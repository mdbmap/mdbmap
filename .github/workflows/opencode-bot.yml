name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: opencode-bot-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  opencode:
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: theacrat/opencode-action/.github/workflows/opencode-bot.yml@prompt-tweaks
    with:
      model: ${{ vars.OPENCODE_BOT_MODEL || vars.OPENCODE_MODEL }}
      use-github-token: ${{ fromJSON(vars.OPENCODE_BOT_USE_GITHUB_TOKEN || vars.OPENCODE_USE_GITHUB_TOKEN || 'false') }}
    secrets:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_BOT_API_KEY || secrets.GOOGLE_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_BOT_API_KEY || secrets.OPENCODE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_BOT_API_KEY || secrets.OPENROUTER_API_KEY }}
