name: OpenCode review gate

on:
  workflow_run:
    workflows: ["OpenCode review"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests?.length) {
              core.info('No pull request linked to workflow run');
              return;
            }
            const pullNumber = pullRequests[0].number;
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const opencodeChanges = reviews.filter(
              (review) =>
                review.user?.type === 'Bot' &&
                review.state === 'CHANGES_REQUESTED' &&
                review.body?.includes('OpenCode PR Review'),
            );
            if (opencodeChanges.length > 0) {
              core.setFailed(
                `OpenCode review requested changes on PR #${pullNumber}. Resolve inline findings before merge.`,
              );
            }
