name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run codegen
          bun run build

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate current commit
        if: github.event_name == 'push'
        run: bun run commitlint --last --verbose

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: bun run commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate types and routes
        run: |
          bun run cf-typegen
          bun run codegen
          bun run build

      - name: Run linter
        run: bun run lint:ci

      - name: Run style linter
        run: bun run lint:style:ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:coverage

      - name: Upload test coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: test-coverage
          path: coverage/
