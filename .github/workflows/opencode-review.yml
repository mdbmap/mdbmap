name: OpenCode review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    uses: theacrat/opencode-action/.github/workflows/opencode-review.yml@prompt-tweaks
    with:
      model: ${{ vars.OPENCODE_REVIEW_MODEL || vars.OPENCODE_MODEL }}
      use-github-token: ${{ fromJSON(vars.OPENCODE_REVIEW_USE_GITHUB_TOKEN || vars.OPENCODE_USE_GITHUB_TOKEN || 'false') }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_REVIEW_API_KEY || secrets.OPENCODE_API_KEY }}
